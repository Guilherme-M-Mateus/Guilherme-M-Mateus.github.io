<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://rvmhxuvqcgoitxpagxyy.supabase.co; base-uri 'none'; form-action 'none'">
<title>Office · Guilherme Mateus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;900&family=Raleway:wght@400;600&display=swap">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="office.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="box">
  <form id="login" class="login">
    <p class="label">Backoffice</p>
    <h1>Office</h1>
    <label>Password <input type="password" name="password" required autocomplete="current-password" autofocus></label>
    <button type="submit">Enter</button>
    <p class="error" role="alert" hidden></p>
  </form>

  <div id="dash" hidden>
    <div class="bar">
      <h1>Office</h1>
      <span><button type="button" id="refresh" class="ghost">Refresh</button> <button type="button" id="logout" class="ghost">Log out</button></span>
    </div>

    <section class="tiles" id="tiles"></section>

    <section>
      <h2>Last 30 days</h2>
      <div class="chart" id="chart" role="img"></div>
    </section>

    <section>
      <h2>Pages</h2>
      <table><thead><tr><th>Page</th><th>Views</th><th>Last visit</th></tr></thead><tbody id="pages"></tbody></table>
    </section>

    <section>
      <h2>Top referrers</h2>
      <table><thead><tr><th>From</th><th>Visits</th></tr></thead><tbody id="refs"></tbody></table>
    </section>

    <section>
      <div class="bar">
        <h2>Messages <span class="muted" id="msg-count"></span></h2>
        <button type="button" id="msg-new" class="ghost">New message</button>
      </div>
      <p class="error" id="msg-error" role="alert" hidden></p>
      <div id="msg-create"></div>
      <div id="messages"></div>
    </section>
  </div>
</main>
<script src="../three.min.js"></script>
<script src="office.js"></script>
</body>
</html>
